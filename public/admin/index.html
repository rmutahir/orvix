<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>ORVIX Admin</title>
<style>
:root{--ink:#0E0A22;--lav:#B9A7F5;--bg:#F6F5FA;--line:rgba(14,10,34,.14);--mut:rgba(14,10,34,.62);--acc:#2A1B5E;--on:#fff;--card:#fff}
@media(prefers-color-scheme:dark){:root{--ink:#F6F5FA;--bg:#0E0A22;--line:rgba(246,245,250,.16);--mut:rgba(246,245,250,.62);--acc:#B9A7F5;--on:#0E0A22;--card:#17112e}}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{font:15px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1{font-size:30px;letter-spacing:-.03em;margin-bottom:18px}h2{font-size:22px;margin-bottom:10px}h3{margin:18px 0 6px}.mt{color:var(--mut);font-size:13px}
input,select,textarea{font:16px inherit;font-family:inherit;padding:11px 14px;border:1.5px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc)}input[type=checkbox]{width:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 20px;border:1.5px solid var(--ink);border-radius:999px;background:transparent;color:var(--ink);font:600 14px inherit;font-family:inherit;cursor:pointer;transition:.2s;text-decoration:none}
.btn:hover{background:var(--acc);border-color:var(--acc);color:var(--on)}.btn.sm{padding:5px 12px;font-size:12px}
#lg{min-height:100svh;display:grid;place-items:center;padding:20px}#lg form{width:min(360px,100%);display:grid;gap:12px;text-align:center}#lg b{letter-spacing:.14em;font-size:20px}.err{color:#c0392b;font-size:13px;min-height:18px}
#app{display:flex;min-height:100svh}
.sb{position:fixed;inset:auto 0 0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:20}
.sb button{background:none;border:0;color:var(--ink);opacity:.5;font:600 13px inherit;font-family:inherit;padding:8px 10px;border-radius:12px;cursor:pointer;text-align:left}.sb button.on{opacity:1;color:var(--acc)}.lo{display:none}.sb button{font-size:12px;padding:8px 5px}
main{flex:1;min-width:0;max-width:980px;padding:24px 18px 110px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:26px}.cd{border:1px solid var(--line);border-radius:18px;padding:16px;background:var(--card)}.cd small{color:var(--mut);display:block}.cd b{font-size:24px;letter-spacing:-.02em}
.ls{display:grid;gap:8px;margin-top:14px}.r{display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);color:var(--ink);font:inherit;width:100%}button.r{cursor:pointer}button.r:hover{border-color:var(--acc)}
.r span{color:var(--mut);font-size:13px}.r2{display:flex;justify-content:space-between;padding:4px 0}
.bd{font-style:normal;font-size:12px;font-weight:600;padding:2px 10px;border-radius:999px;border:1px solid var(--line);align-self:start;justify-self:end;grid-row:1/3;grid-column:2}
.bd.confirmed{background:var(--lav);color:#0E0A22;border-color:var(--lav)}.bd.shipped{border-color:var(--acc);color:var(--acc)}.bd.delivered{border-color:#1f8f5f;color:#1f8f5f}.bd.cancelled{border-color:#c0392b;color:#c0392b}
.md{position:fixed;inset:0;background:rgba(14,10,34,.5);display:grid;place-items:end center;z-index:40;overflow:auto}
.mc{position:relative;background:var(--bg);width:min(560px,100%);max-height:92svh;overflow:auto;border-radius:24px 24px 0 0;padding:26px 20px calc(26px + env(safe-area-inset-bottom,0px))}
.x{position:absolute;right:14px;top:10px;background:none;border:0;font-size:28px;color:var(--ink);cursor:pointer}
.bx{border:1px solid var(--line);border-radius:14px;padding:8px 14px;margin:12px 0;background:var(--card)}.ac,.in{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.in input{flex:1;min-width:140px}
.tl{list-style:none;padding:0;border-left:2px solid var(--line);margin-left:6px}.tl li{padding:0 0 12px 14px}.tl small{display:block;color:var(--mut)}
.fm{display:grid;gap:12px}.fm label{display:grid;gap:4px;font-size:13px;color:var(--mut)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ck{display:flex!important;align-items:center;gap:8px;grid-template-columns:none}
select#fl{width:auto;margin-bottom:6px}
@media(min-width:820px){.sb{inset:0 auto 0 0;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;border:0;border-right:1px solid var(--line);padding:28px 14px}.lo{display:block;font-weight:700;letter-spacing:.14em;margin:0 10px 22px}.sb button{font-size:13px;padding:8px 10px}main{margin-left:220px;padding:44px 40px}.cards{grid-template-columns:repeat(4,1fr)}.md{place-items:center}.mc{border-radius:24px}}
.sk{background:linear-gradient(90deg,var(--line) 25%,rgba(185,167,245,.3) 50%,var(--line) 75%);background-size:200% 100%;animation:sh 1.4s infinite;border-radius:12px}@keyframes sh{to{background-position:-200% 0}}
.ims{display:flex;gap:8px;flex-wrap:wrap}.th{position:relative;width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--line);display:grid;place-items:center;font-size:26px;cursor:pointer;flex:none}.th img{width:100%;height:100%;object-fit:cover}.th.main{outline:2px solid var(--acc)}.th em{position:absolute;bottom:0;left:0;right:0;background:var(--acc);color:var(--on);font:600 10px sans-serif;text-align:center}.rm{position:absolute;top:2px;right:2px;width:18px;height:18px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer;line-height:1;padding:0}.mini{width:22px;height:22px;border-radius:6px;object-fit:cover;vertical-align:middle}
</style></head><body>
<div id="lg"><form id="lf"><b>ORVIX</b><span class="mt">Admin sign in</span><input id="pw" type="password" placeholder="Password" autocomplete="current-password" required><button class="btn">Sign in</button><p class="err" id="le" role="alert"></p></form></div>
<div id="app" hidden><nav class="sb"><div class="lo">ORVIX Admin</div><button data-t="dash">Dashboard</button><button data-t="orders">Orders</button><button data-t="products">Products</button><button data-t="content">Content</button><button data-t="reviews">Reviews</button><button data-t="settings">Settings</button><button id="out" class="lo">Sign out</button></nav><main id="mn"></main></div>
<div class="md" id="md" hidden><div class="mc" id="mc"></div></div>
<script src="/admin/admin.js"></script></body></html>
